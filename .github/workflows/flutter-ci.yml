name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android platform
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --org com.team17 \
              --project-name team17_flutter_project
          fi
          rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Auth service tests
        run: flutter test test/auth/auth_service_test.dart

      - name: Theme tests
        run: flutter test test/theme/app_theme_test.dart

      - name: Login screen tests
        run: flutter test test/auth/login_screen_test.dart

      - name: Full test suite
        run: flutter test

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug
